<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3446C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<title>Gestione Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra laterale con sezioni a colori; "Oggi" apre con un saluto che cambia colore con l'ora; pulsante + sempre a portata */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#F0F2F8; --ink:#1B2040; --muted:#676E8F; --line:#E2E5F0;
  --accent:#3446C8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --warn:#A8650A; --warn-soft:#FFF1D6; --bad:#C23B3B; --bad-soft:#FDE3E1;
  --c-lavoro:#5468A8; --c-studio:#1E8C5A; --c-sport:#E66A2C; --c-hobby:#8A55D6; --c-altro:#7F86A3; --c-evento:#D43F5E;
  --p-fanny:#E0457B; --p-fanny-soft:#FDE6EF; --p-claudia:#13998A; --p-claudia-soft:#DAF3EF;
  --h-oggi:#F09A00; --h-agenda:#3446C8; --h-lavoro:#56628A; --h-spesa:#22A060; --h-dispensa:#EE7424; --h-casa:#8A55D6; --h-studio:#0F86C2;
  --shadow:0 1px 2px rgba(27,32,64,.05),0 12px 32px -14px rgba(27,32,64,.18);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10132A; --surface:#191D38; --surface-2:#22274A; --ink:#ECEEFA; --muted:#9CA2C4; --line:#2D3359;
    --accent:#8C99FF; --accent-ink:#10132A; --accent-soft:#2A3170;
    --warn:#F2B755; --warn-soft:#3D3018; --bad:#FF8A80; --bad-soft:#47201F;
    --c-lavoro:#93A5E6; --c-studio:#5FD39B; --c-sport:#FF9A62; --c-hobby:#B794F4; --c-altro:#A3A9C7; --c-evento:#FF7A95;
    --p-fanny:#FF7FAA; --p-fanny-soft:#45203A; --p-claudia:#4FD1C0; --p-claudia-soft:#163B3C;
    --h-oggi:#FFC14D; --h-agenda:#8C99FF; --h-lavoro:#A3AED6; --h-spesa:#5FD39B; --h-dispensa:#FF9A55; --h-casa:#B794F4; --h-studio:#5CC3F5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10132A; --surface:#191D38; --surface-2:#22274A; --ink:#ECEEFA; --muted:#9CA2C4; --line:#2D3359;
  --accent:#8C99FF; --accent-ink:#10132A; --accent-soft:#2A3170;
  --warn:#F2B755; --warn-soft:#3D3018; --bad:#FF8A80; --bad-soft:#47201F;
  --c-lavoro:#93A5E6; --c-studio:#5FD39B; --c-sport:#FF9A62; --c-hobby:#B794F4; --c-altro:#A3A9C7; --c-evento:#FF7A95;
  --p-fanny:#FF7FAA; --p-fanny-soft:#45203A; --p-claudia:#4FD1C0; --p-claudia-soft:#163B3C;
  --h-oggi:#FFC14D; --h-agenda:#8C99FF; --h-lavoro:#A3AED6; --h-spesa:#5FD39B; --h-dispensa:#FF9A55; --h-casa:#B794F4; --h-studio:#5CC3F5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:30px;line-height:1.1} h2{font-size:19px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--h,var(--accent)) 15%,transparent);color:var(--h,var(--accent));flex:none}
.ico svg{width:19px;height:19px}
.ico.big{width:54px;height:54px;border-radius:17px;background:var(--h,var(--accent));color:#fff;box-shadow:0 8px 20px -8px var(--h,var(--accent))}
.ico.big svg{width:27px;height:27px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;padding:0 10px 18px;display:flex;align-items:center;gap:9px}
.brand i{width:28px;height:28px;border-radius:9px;background:conic-gradient(from 200deg,var(--p-fanny),var(--h-oggi),var(--p-claudia),var(--h-agenda),var(--p-fanny));display:block}
.navbtn{display:flex;align-items:center;gap:11px;padding:7px 10px;border:0;background:none;border-radius:13px;text-align:left;color:var(--muted);font-weight:600}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:color-mix(in srgb,var(--h) 12%,transparent);color:var(--ink)}
.navbtn[aria-current="page"] .ico{background:var(--h);color:#fff}
.navbtn .badge{margin-left:auto}
.sync{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--h-spesa)} .dot.err{background:var(--bad)}

main{padding:26px clamp(16px,4vw,44px) 120px;max-width:1120px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.head > div:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.head > div:first-child > .ico{grid-row:1 / span 3;align-self:start}
.head > div:first-child > :not(.ico){grid-column:2}
.head p{margin:4px 0 0}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card > h2,.card > .row h2{margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list > li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.grow .t{font-weight:600;overflow-wrap:anywhere}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .12s, box-shadow .12s, filter .12s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.big{padding:12px 24px;font-size:16px;border-radius:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);box-shadow:none}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.onhero{background:#fff;color:#1B2040;border:0;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.icon-btn{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--h-spesa) 15%,transparent);color:var(--h-spesa)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}

input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar input{flex:1 1 180px}
.addbar select{flex:0 1 170px;width:auto}

.check{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:8px;flex:none;display:grid;place-items:center;background:var(--surface);cursor:pointer;margin:0;transition:transform .15s}
.check:hover{border-color:var(--h-spesa)}
.check:checked{background:var(--h-spesa);border-color:var(--h-spesa);transform:scale(1.08)}
.check:checked::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}

/* hero */
.now{--g:linear-gradient(135deg,#56628A,#2B3157);background:var(--g);color:#fff;border:0;padding:22px;display:grid;gap:16px;grid-template-columns:1fr 1fr auto;align-items:center;position:relative;overflow:hidden}
.now::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.now.mattina{--g:linear-gradient(135deg,#FFCF5C 0%,#FF8E6E 100%);color:#2A1508}
.now.pomeriggio{--g:linear-gradient(135deg,#4FB8E6 0%,#2F62D6 100%)}
.now.sera{--g:linear-gradient(135deg,#3446C8 0%,#191C47 100%)}
.now .lab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.8;font-weight:700}
.now .big{font-family:var(--display);font-size:24px;font-weight:700;margin-top:2px;line-height:1.15}
.now .sub{opacity:.88;font-size:14px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:17px}
@media (max-width:620px){.now{grid-template-columns:1fr}.now .ring{position:absolute;right:18px;top:18px;width:60px;height:60px}}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.timeline li{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--ps,var(--surface-2));border-left:4px solid var(--pc,var(--cat,var(--c-altro)))}
.timeline li.past{opacity:.45}
.timeline li.live{box-shadow:0 0 0 2px var(--pc,var(--accent))}
.timeline .when{font-weight:700}
.alert{border-left:4px solid var(--line);padding-left:12px}
.alert.bad{border-color:var(--bad)} .alert.warn{border-color:var(--warn)} .alert.ok{border-color:var(--h-spesa)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{--h:var(--accent);border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.chip b{display:block;font-family:var(--display);font-size:20px}
button.chip:hover{transform:translateY(-2px);border-color:var(--h)}

/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent),var(--shadow)}
.day h3{font-size:14px;display:flex;justify-content:space-between;align-items:center}
.slot{border:0;text-align:left;background:var(--ps,var(--surface-2));border-left:4px solid var(--pc,var(--cat));color:var(--ink);display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:7px 9px;font-size:13px;line-height:1.3;transition:transform .12s}
.slot b{display:block;font-weight:700;overflow-wrap:anywhere}
.slot:hover{transform:translateX(2px)}
.p-fanny{--pc:var(--p-fanny);--ps:var(--p-fanny-soft)}
.p-claudia{--pc:var(--p-claudia);--ps:var(--p-claudia-soft)}
.p-both{--pc:var(--muted);--ps:var(--surface-2)}
.slot-who{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pc)}
.slot .catdot{width:8px;height:8px;border-radius:50%}
.slot .num{white-space:nowrap;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.legend .sw{width:22px;height:14px;border-radius:4px;background:var(--ps);border-left:4px solid var(--pc)}
@media (max-width:900px){.week{grid-template-columns:1fr}.day{min-height:0}}
.catdot{width:10px;height:10px;border-radius:3px;background:var(--cat);flex:none}

.groupname{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 2px}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px}
.qty span{min-width:50px;text-align:center;font-weight:700;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--h-spesa);border-radius:99px;transition:width .4s}
.subj{display:flex;flex-direction:column;gap:12px}
.timer{font-family:var(--display);font-size:60px;font-weight:700;text-align:center;letter-spacing:-.02em;line-height:1}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.people{border-radius:99px;padding:3px;gap:3px}
.seg.people button{border-radius:99px;display:inline-flex;align-items:center;gap:7px;padding:4px 14px 4px 4px}
.seg.people button[aria-pressed="true"]{background:var(--pc);color:#fff}
.seg.people button[aria-pressed="true"] .avatar{background:#fff;color:var(--pc)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--pc,var(--muted));color:#fff;font-style:normal;font-size:12px;font-weight:800;display:inline-grid;place-items:center;flex:none;font-family:var(--display)}
.avatar.lg{width:46px;height:46px;font-size:19px}

.demo{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.demo p{margin:0;flex:1 1 260px}
.empty{color:var(--muted);padding:12px 2px;margin:0}

/* punteggio faccende */
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pscore{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--ps)}
.pscore b{font-family:var(--display);font-size:28px;line-height:1;display:block}
.pscore.lead{box-shadow:0 0 0 2px var(--pc)}

/* modale */
.scrim{position:fixed;inset:0;background:rgba(14,17,40,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.scrim.open{display:flex}
@media (min-width:600px){.scrim{align-items:center}}
.modal{background:var(--surface);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.scrim.open .modal{animation:rise .22s cubic-bezier(.2,.9,.3,1.2)}@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}}}
.mhead{--h:var(--accent);display:flex;align-items:center;gap:12px;padding:18px 20px;background:color-mix(in srgb,var(--h) 13%,var(--surface));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.mhead h2{flex:1;font-size:21px}
.mhead .ico{background:var(--h);color:#fff;width:40px;height:40px;border-radius:13px}
.mbody{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.field > label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:inline-flex}
.choice input,.days input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);transition:transform .12s, background .12s}
.choice span:hover{border-color:var(--muted)}
.choice input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.04)}
.choice label.cat input:checked + span{background:var(--cat);border-color:var(--cat);color:#fff}
.choice label.p-fanny input:checked + span,.choice label.p-claudia input:checked + span,.choice label.p-both input:checked + span{background:var(--pc);border-color:var(--pc);color:#fff}
.choice label.p-fanny span,.choice label.p-claudia span,.choice label.p-both span{padding-left:5px}
.choice input:checked + span .avatar{background:#fff;color:var(--pc)}
.choice .catdot{width:10px;height:10px;border-radius:50%}
.choice input:checked + span .catdot{background:#fff}
.choice input:focus-visible + span,.days input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.sugg button{border:1px solid transparent;background:color-mix(in srgb,var(--h,var(--accent)) 10%,var(--surface));color:var(--ink);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.sugg button::before{content:"+ ";color:var(--h,var(--accent));font-weight:800}
.sugg button.q::before{content:""}
.sugg button:hover{border-color:var(--h,var(--accent))}
.stepper{display:flex;gap:8px}
.stepper input{text-align:center;font-weight:700;font-size:17px}
.stepper button{width:48px;flex:none;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:600;line-height:1}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex}
.days span{border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;font-size:14px;cursor:pointer;font-weight:700;min-width:46px;text-align:center}
.days input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:18px 20px 22px}
.addtile{--h:var(--accent);display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;transition:transform .15s, border-color .15s, background .15s}
.addtile:hover{transform:translateY(-3px);border-color:var(--h);background:color-mix(in srgb,var(--h) 8%,var(--surface))}
.addtile b{font-size:15px}
.addtile span:last-child{font-size:12px;color:var(--muted)}
.addtile .ico{background:var(--h);color:#fff}

  try { await loadScript(base + "firebase-app-compat.js"); await loadScript(base + "firebase-auth-compat.js"); await loadScript(base + "firebase-firestore-compat.js"); }
  catch (e) { store.mode = "local"; store.err = "Non riesco a collegarmi: controlla la connessione"; setStatus(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  fbAuth.onAuthStateChanged(u => {
    needLogin = !u;
    if (u) { store.ref = firebase.firestore().doc("casa/stato"); listen(null); }
    else { if (unsub) unsub(); unsub = null; store.ref = null; store.mode = "local"; }

}
const startSync = () => FIREBASE_CONFIG ? connectFirebase() : connect();

/* ---------- logica ---------- */
function todayItems(dateStr) {
  const dow = parseD(dateStr).getDay();
  const r = S.routine.filter(x => mine(x.who) && (x.days || []).includes(dow)).map(x => ({ id: x.id, kind: "routine", title: x.title, cat: x.cat, start: x.start, end: x.end, note: x.note, who: x.who }));
  const e = S.events.filter(x => mine(x.who) && x.date === dateStr).map(x => ({ id: x.id, kind: "event", title: x.title, cat: "evento", start: x.time || "", end: "", note: x.note, who: x.who }));
  return [...r, ...e].sort((a, b) => (a.start ? toMin(a.start) : -1) - (b.start ? toMin(b.start) : -1));
}
const choreDue = c => c.last ? addDays(c.last, Number(c.every) || 7) : today();
const choreVisible = c => me === "tutte" || !c.who || c.who === me || (c.who === "turno" && (c.turn || "fanny") === me);
function balance() {
  let bal = 0; // positivo: Claudia deve a Fanny
  for (const b of S.bills) { if (!b.paid || !b.paidBy) continue; const a = Number(b.amount) || 0; const sf = b.split === "meta" ? a / 2 : b.split === "fanny" ? a : 0; const sc = a - sf; if (b.paidBy === "fanny") bal += sc; else if (b.paidBy === "claudia") bal -= sf; }
  for (const x of S.settlements) { const v = Number(x.amount) || 0; if (x.from === "claudia") bal -= v; else bal += v; }
  return Math.round(bal * 100) / 100;
}
const isLow = p => Number(p.min) > 0 && Number(p.qty) <= Number(p.min);
const onShopList = name => S.shop.some(s => !s.done && s.name.trim().toLowerCase() === name.trim().toLowerCase());
function weekMinutes(subjId) { const m = mondayOf(today()); return S.studyLog.filter(l => l.date >= m && (subjId ? l.subj === subjId : S.subjects.some(s => s.id === l.subj && mine(s.who)))).reduce((a, l) => a + (Number(l.min) || 0), 0); }

function alerts() {
  const t = today(), out = [];
  for (const c of S.chores) { if (!choreVisible(c)) continue; const n = daysBetween(t, choreDue(c)); if (n <= 0) out.push({ sev: n < 0 ? 0 : 1, cls: n < 0 ? "bad" : "warn", txt: c.name + (c.who === "turno" ? " · tocca a " + pname(c.turn) : c.who ? " · " + pname(c.who) : ""), sub: n < 0 ? `Faccenda in ritardo di ${-n} ${-n === 1 ? "giorno" : "giorni"}` : "Faccenda da fare oggi", act: `<button class="btn sm" data-act="chore-done" data-id="${c.id}">Fatto</button>` }); }
  for (const b of S.bills) { if (b.paid) continue; const n = daysBetween(t, b.due); if (n <= 7) out.push({ sev: n < 0 ? 0 : n <= 2 ? 1 : 2, cls: n < 0 ? "bad" : n <= 2 ? "warn" : "ok", txt: `${b.name} · ${euro(b.amount)}`, sub: n < 0 ? `Bolletta scaduta ${relD(n)}` : `Bolletta da pagare ${relD(n)}`, act: `<button class="btn sm" data-act="bill-paid" data-id="${b.id}">Pagata</button>` }); }
  for (const p of S.pantry) { if (!p.exp || Number(p.qty) <= 0) continue; const n = daysBetween(t, p.exp); if (n <= 3) out.push({ sev: n <= 0 ? 0 : 1, cls: n <= 0 ? "bad" : "warn", txt: p.name, sub: n < 0 ? "Scaduto" : n === 0 ? "Scade oggi: usalo subito" : `Scade ${relD(n)}`, act: `<button class="btn sm ghost" data-go="dispensa">Dispensa</button>` }); }
  for (const p of S.pantry) { if (isLow(p) && !onShopList(p.name)) out.push({ sev: 2, cls: "warn", txt: p.name, sub: Number(p.qty) <= 0 ? "Finito" : "Sta per finire", act: `<button class="btn sm" data-act="pantry-toshop" data-id="${p.id}">In lista spesa</button>` }); }
  for (const s of S.subjects) { if (!s.exam || !mine(s.who)) continue; const n = daysBetween(t, s.exam); if (n >= 0 && n <= 21) out.push({ sev: n <= 7 ? 1 : 3, cls: n <= 7 ? "warn" : "ok", txt: `Esame: ${s.name}`, sub: `${relD(n)} · ${s.topics.filter(x => x.done).length}/${s.topics.length} argomenti pronti`, act: `<button class="btn sm ghost" data-go="studio">Studio</button>` }); }
  for (const e of S.events) { if (mine(e.who) && e.date === addDays(t, 1)) out.push({ sev: 2, cls: "ok", txt: `Domani: ${e.title}`, sub: (e.time ? "alle " + e.time : "") + (e.note ? " · " + e.note : ""), act: "" }); }
  return out.sort((a, b) => a.sev - b.sev);
}

};

let workMonth = today().slice(0, 7);
const workMin = w => { if (!w.start || !w.end) return 0; let d = toMin(w.end) - toMin(w.start); if (d < 0) d += 1440; return Math.max(0, d - (Number(w.pause) || 0)); };
const fmtH = m => { m = Math.round(m); return `${Math.floor(m / 60)} h ${pad(m % 60)}`; };
const clockMin = p => { const c = S.work.clocks[p]; return c ? Math.max(0, Math.round((Date.now() - new Date(c.ts).getTime()) / 60000)) : 0; };
const sumWork = (f, p) => S.work.entries.filter(w => w.who === p && f(w.date)).reduce((a, w) => a + workMin(w), 0);
function workByDay(f, p) { const m = {}; for (const w of S.work.entries) if (w.who === p && f(w.date)) m[w.date] = (m[w.date] || 0) + workMin(w); return m; }
const dayTarget = p => (Number(S.work.settings[p].dailyH) || 0) * 60;
const overtimeOf = (byDay, p) => dayTarget(p) ? Object.values(byDay).reduce((a, m) => a + Math.max(0, m - dayTarget(p)), 0) : 0;
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return MON[m - 1][0].toUpperCase() + MON[m - 1].slice(1) + " " + y; };
const shiftMonth = (ym, n) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
const fmtDS = s => { const d = parseD(s); return DOW[d.getDay()] + " " + d.getDate(); };
const workP = () => subMe;

R.lavoro = () => {
  const t = today(), wk = mondayOf(t), p = workP(), st = S.work.settings[p], c = S.work.clocks[p];
  const inMonth = x => x.slice(0, 7) === workMonth;
  const byDayM = workByDay(inMonth, p);
  const monthTot = Object.values(byDayM).reduce((a, b) => a + b, 0);
  const weekTot = sumWork(x => x >= wk && x <= addDays(wk, 6), p);
  const todayTot = sumWork(x => x === t, p) + (c ? clockMin(p) : 0);
  const ot = overtimeOf(byDayM, p);
  const days = Object.keys(byDayM).length;
  const entries = S.work.entries.filter(w => w.who === p && inMonth(w.date)).sort((a, b) => (b.date + b.start).localeCompare(a.date + a.start));
  const weeks = {}; for (const w of entries) { const k = mondayOf(w.date); (weeks[k] = weeks[k] || []).push(w); }
  const weekPct = st.weeklyH ? Math.min(100, Math.round(weekTot / (st.weeklyH * 60) * 100)) : 0;
  const tgt = dayTarget(p);
  return `

/* ---------- modale generica ---------- */
let modalSave = null;
const modalOpen = () => $("#scrim").classList.contains("open");
const val = v => typeof v === "function" ? v() : v;
const pairs = arr => (val(arr) || []).map(o => Array.isArray(o) ? o : [o, o]);
function openForm(title, fields, init, onSave, onDelete) {
  init = init || {};
  const isEdit = !!init.id, hue = fields.hue || view;
  const f = fields.map(x => {
    const v = init[x.k] ?? x.def ?? "";
    const opts = x.options ? pairs(x.options) : [];
    let input;
    if (x.type === "select" && opts.length <= 8) input = `<div class="choice" id="f-${x.k}" role="radiogroup" aria-label="${esc(x.label)}">${opts.map(([ov, lab], i) => {
      const person = x.k === "who" || x.k === "paidBy" || (x.k === "split" && ov !== "meta");
      const pc = person ? (ov === "fanny" || ov === "claudia" ? "p-" + ov : "p-both") : "";
      const isCat = x.k === "cat" && CATS[ov];
      const checked = String(v) === String(ov) || (v === "" && !opts.some(o => o[0] === "") && i === 0 && x.k !== "cat");
      const av = pc ? `<i class="avatar">${ov === "fanny" ? "F" : ov === "claudia" ? "C" : ov === "turno" ? "↻" : "F+C"}</i>` : isCat ? '<i class="catdot"></i>' : "";
      return `<label class="${pc} ${isCat ? "cat" : ""}" ${isCat ? `style="--cat:var(${CATS[ov].v})"` : ""}><input type="radio" name="f-${x.k}" value="${esc(ov)}" ${checked ? "checked" : ""}><span>${av}${esc(lab)}</span></label>`;
    }).join("")}</div>`;
    else if (x.type === "select") input = `<select id="f-${x.k}">${opts.map(([ov, lab]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>`;
    else if (x.type === "days") input = `<div class="days" id="f-${x.k}">${WEEK_ORDER.map(d => `<label><input type="checkbox" value="${d}" ${(v || []).includes(d) ? "checked" : ""}><span>${DOW[d]}</span></label>`).join("")}</div><div class="sugg"><button type="button" class="q" data-days="1,2,3,4,5">Lun–Ven</button><button type="button" class="q" data-days="6,0">Weekend</button><button type="button" class="q" data-days="0,1,2,3,4,5,6">Tutti i giorni</button></div>`;
    else if (x.type === "textarea") input = `<textarea id="f-${x.k}" rows="3">${esc(v)}</textarea>`;
    else if (x.type === "number") input = `<div class="stepper"><button type="button" data-step="-1" data-for="f-${x.k}" aria-label="Meno">−</button><input id="f-${x.k}" type="number" inputmode="decimal" value="${esc(v)}" ${x.step ? `step="${x.step}"` : ""} ${x.min !== undefined ? `min="${x.min}"` : ""}><button type="button" data-step="1" data-for="f-${x.k}" aria-label="Più">+</button></div>`;
    else input = `<input id="f-${x.k}" type="${x.type || "text"}" value="${esc(v)}" autocomplete="off" ${x.ph ? `placeholder="${esc(x.ph)}"` : ""}>`;
    const sg = x.sugg ? pairs(x.sugg) : [];
    const sugg = sg.length ? `<div class="sugg" style="--h:var(--h-${hue})">${sg.map(([sv, lab, cat]) => `<button type="button" class="${x.type === "text" || !x.type ? "" : "q"}" data-fill="f-${x.k}" data-v="${esc(sv)}" ${cat ? `data-cat="${esc(cat)}"` : ""}>${esc(lab)}</button>`).join("")}</div>` : "";

    "shop-add-low": () => { let n = 0; for (const p of S.pantry) if (isLow(p) && !onShopList(p.name)) { S.shop.push({ id: uid(), name: p.name, qty: "", cat: placeToShop(p.place), done: false }); n++; } toast(`${n} ${n === 1 ? "prodotto aggiunto" : "prodotti aggiunti"} alla lista.`); },
    "shop-to-pantry": () => {
      let n = 0;
      for (const s of S.shop.filter(x => x.done)) {
        const p = S.pantry.find(x => x.name.trim().toLowerCase() === s.name.trim().toLowerCase());
        const q = parseFloat(String(s.qty).replace(",", ".")) || 1;
        if (p) p.qty = Math.round(((Number(p.qty) || 0) + q) * 100) / 100;
        else S.pantry.push({ id: uid(), name: s.name, qty: q, unit: "pz", min: 0, place: shopToPlace(s.cat), exp: "" });
        n++;
      }
      S.shop = S.shop.filter(x => !x.done);
      toast(`${n} ${n === 1 ? "prodotto messo" : "prodotti messi"} in dispensa. Aggiungi le scadenze se servono.`);
    },
    "copy-shop": () => {
      const txt = SHOP_CATS.map(c => { const its = S.shop.filter(s => !s.done && (s.cat || "Altro") === c); return its.length ? c.toUpperCase() + "\n" + its.map(s => "- " + s.name + (s.qty ? " (" + s.qty + ")" : "")).join("\n") : ""; }).filter(Boolean).join("\n\n");
      navigator.clipboard.writeText(txt || "Lista vuota").then(() => toast("Lista copiata: incollala su WhatsApp o nelle note."), () => toast("Non riesco a copiare da qui. Seleziona la lista a mano."));
      return "nosave";
    },
    "pf": () => { pantryFilter = a.dataset.v; return "nosave"; },
    "pq": () => { const p = find(S.pantry, id); if (p) { const step = (p.unit === "kg" || p.unit === "L") ? 0.5 : 1; p.qty = Math.max(0, Math.round(((Number(p.qty) || 0) + step * Number(a.dataset.d)) * 100) / 100); } },
    "topic-toggle": () => { const s = find(S.subjects, a.dataset.sid); const tp = s && find(s.topics, id); if (!tp) return; tp.done = !tp.done; if (tp.done) { const all = s.topics.every(x => x.done); celebrate(all); toast(all ? `Tutti gli argomenti di ${s.name} sono pronti!` : `${cheer()} ${tp.t} pronto.`); } },
    "topic-del": () => { const s = find(S.subjects, a.dataset.sid); if (s) s.topics = s.topics.filter(x => x.id !== id); },
    "tm": () => { if (timer.running) return "nosave"; timer.mode = a.dataset.v; timer.left = (timer.mode === "focus" ? 25 : 5) * 60; return "nosave"; },
    "timer-toggle": () => { timerToggle(); return "nosave"; },
    "clock-in": () => { const p = workP(), d = new Date(); S.work.clocks[p] = { ts: d.toISOString(), date: today(), start: pad(d.getHours()) + ":" + pad(d.getMinutes()), place: (S.work.entries.filter(w => w.who === p).sort((a, b) => b.date.localeCompare(a.date))[0] || {}).place || "" }; toast(`${pname(p)}: turno iniziato alle ${S.work.clocks[p].start}.`); },
    "clock-out": () => { const p = workP(), c = S.work.clocks[p], d = new Date(); if (!c) return; openForm("Fine turno di " + pname(p), FORMS.work, { date: c.date, start: c.start, end: pad(d.getHours()) + ":" + pad(d.getMinutes()), pause: S.work.settings[p].pause, place: c.place }, o => { S.work.entries.push({ id: uid(), who: p, ...o }); S.work.clocks[p] = null; workMonth = o.date.slice(0, 7); lastXY = null; celebrate(); toast("Giornata salvata: " + fmtH(workMin(o)) + " di lavoro. Riposati!"); }); },
    "add-work": () => { const p = workP(), last = S.work.entries.filter(w => w.who === p).sort((a, b) => b.date.localeCompare(a.date))[0] || {}; openForm("Nuova giornata di " + pname(p), FORMS.work, { date: t, start: last.start || "08:00", end: last.end || "17:00", pause: S.work.settings[p].pause, place: last.place || "" }, o => { S.work.entries.push({ id: uid(), who: p, ...o }); workMonth = o.date.slice(0, 7); }); },
    "edit-work": () => { const r = find(S.work.entries, id); openForm("Modifica giornata", FORMS.work, r, o => Object.assign(r, o), () => { S.work.entries = S.work.entries.filter(x => x.id !== id); }); },
    "work-settings": () => { const p = workP(); openForm("Orario previsto di " + pname(p), FORMS.worksettings, S.work.settings[p], o => { Object.assign(S.work.settings[p], o); }); },
    "wm": () => { workMonth = shiftMonth(workMonth, Number(a.dataset.d)); return "nosave"; },
    "copy-work": () => {
      const p = workP(), es = S.work.entries.filter(w => w.who === p && w.date.slice(0, 7) === workMonth).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
      const by = workByDay(x => x.slice(0, 7) === workMonth, p), tot = Object.values(by).reduce((a, b) => a + b, 0);
      const txt = "ORE DI LAVORO - " + pname(p).toUpperCase() + " - " + monthLabel(workMonth).toUpperCase() + "\n" + es.map(w => `${fmtDS(w.date)}/${w.date.slice(5, 7)}  ${w.start}-${w.end}${Number(w.pause) ? "  pausa " + w.pause + "'" : ""}  = ${fmtH(workMin(w))}${w.place ? "  (" + w.place + ")" : ""}`).join("\n") + `\n\nTotale: ${fmtH(tot)} in ${Object.keys(by).length} giorni\nStraordinari: ${fmtH(overtimeOf(by, p))}`;
      navigator.clipboard.writeText(txt).then(() => toast("Riepilogo copiato."), () => toast("Non riesco a copiare da qui."));
      return "nosave";
    },
    "timer-reset": () => { clearInterval(timer.int); timer.running = false; timer.left = (timer.mode === "focus" ? 25 : 5) * 60; return "nosave"; }
  };
  if (!A[act]) return;
  const r = A[act]();
  if (/^(add|edit|log-study|clock-out|work-settings)/.test(act)) return;
  if (r === "modal") return;
  if (r !== "nosave") save();
  render();
});
const placeToShop = p => p === "Frigo" ? "Frigo" : p === "Freezer" ? "Surgelati" : p === "Casa" ? "Casa e pulizia" : "Dispensa";

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === "login") {
    const em = $("#lg-email").value.trim(), pw = $("#lg-pw").value;
    $("#lg-err").textContent = "Accesso in corso…";
    fbAuth.signInWithEmailAndPassword(em, pw).catch(err => { $("#lg-err").textContent = /wrong-password|invalid-credential|user-not-found|invalid-email/.test(err.code || "") ? "Email o password sbagliate." : "Non riesco ad accedere. Riprova."; });
    return;
  }
  if (k === "note") { const v = $("#note-in").value.trim(); if (!v) return; S.notes.unshift({ id: uid(), text: v, created: today(), who: me === "tutte" ? "" : me }); }
  if (k === "shop") { const v = $("#shop-name").value.trim(); if (!v) return; const cat = $("#shop-cat").value; S.shop.push({ id: uid(), name: v, qty: $("#shop-qty").value.trim(), cat, done: false }); save(); render(); const ns = $("#shop-cat"); if (ns) ns.value = cat; $("#shop-name").focus(); return; }
  if (k === "topic") { const inp = f.querySelector("input"); const v = inp.value.trim(); if (!v) return; const s = find(S.subjects, f.dataset.sid); if (s) s.topics.push({ id: uid(), t: v, done: false }); save(); render(); const nf = document.querySelector(`[data-form="topic"][data-sid="${f.dataset.sid}"] input`); if (nf) nf.focus(); return; }
  save(); render();
});

/* ---------- timer ---------- */
function timerToggle() {
  if (timer.running) { clearInterval(timer.int); timer.running = false; return; }
  timer.running = true;
  timer.int = setInterval(() => {
    timer.left--;
    const d = $("#timer-display"); if (d) d.textContent = fmtT(Math.max(0, timer.left));
    if (timer.left <= 0) {
      clearInterval(timer.int); timer.running = false;
      if (timer.mode === "focus") {
        if (timer.subj && find(S.subjects, timer.subj)) { S.studyLog.push({ id: uid(), subj: timer.subj, date: today(), min: 25 }); save(); }
        lastXY = null; celebrate(true); toast("25 minuti di studio completati. Ora 5 minuti di pausa.", true);
        timer.mode = "pausa"; timer.left = 5 * 60;
      } else { toast("Pausa finita: si ricomincia.", true); timer.mode = "focus"; timer.left = 25 * 60; }
      beep();
      if (view === "studio" && !modalOpen()) render();
    }
  }, 1000);
}
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .35); } catch (e) {} }

/* ---------- avvisi mentre la pagina è aperta ---------- */
function toast(msg, sticky) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span><button aria-label="Chiudi">×</button>`;
  el.querySelector("button").onclick = () => el.remove();
  $("#toasts").appendChild(el);
  if (!sticky) setTimeout(() => el.remove(), 4500);
}
const announced = new Set();
function tick() {
  const t = today(), now = nowMin();
  for (const i of todayItems(t)) {
    if (!i.start) continue;
    const diff = toMin(i.start) - now, key = t + i.id + i.start;
    if (diff >= 0 && diff <= 15 && !announced.has(key)) { announced.add(key); toast(`${diff === 0 ? "Adesso" : "Tra " + diff + " min"}: ${i.who ? pname(i.who) + ", " : ""}${i.title}${i.note ? " · " + i.note : ""}`, true); beep(); }
  }
  const active = document.activeElement;
  if ((view === "oggi" || view === "lavoro") && !modalOpen() && !(active && /INPUT|TEXTAREA|SELECT/.test(active.tagName))) render();
}
for (const i of todayItems(today())) { if (i.start && toMin(i.start) < nowMin()) announced.add(today() + i.id + i.start); }
setInterval(tick, 30000);

render(); setStatus(); startSync(); setTimeout(tick, 1500);
</script>
